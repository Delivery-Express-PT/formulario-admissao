<style>
:root{
  --bg:#EEF2F7;--surface:#fff;--surface-2:#F6F8FB;--line:rgba(16,28,48,.09);--line-2:rgba(16,28,48,.16);
  --text:#0E1626;--muted:#566178;--faint:#6B7689;
  --accent:#2A74D6;--accent-2:#307FE2;--accent-soft:rgba(48,127,226,.10);
  --crit:#D93F46;--crit-soft:rgba(217,63,70,.09);--warn:#B86E00;--warn-soft:rgba(214,138,10,.14);--ok:#168A56;--ok-soft:rgba(22,138,86,.11);
  --field:#F5B700;--field-soft:rgba(245,183,0,.16);

  --shadow-3:0 24px 64px -16px rgba(16,28,48,.30),0 6px 18px rgba(16,28,48,.08);
  --side-bg1:#0b1120;--side-bg2:#0e1628;--side-tx:#94a3b8;
  --f-d:'Sora',ui-sans-serif,system-ui,sans-serif;--f-b:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--f-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{

*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3{font-family:var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
p{text-wrap:pretty}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(90,162,255,.7),transparent)}

@keyframes shine{0%{background-position:100% 0}35%,100%{background-position:-60% 0}}
.steps{flex:1;display:flex;justify-content:center;gap:8px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#7d8aa0;white-space:nowrap}
.steps li:not(:last-child)::after{content:"";width:28px;height:2px;border-radius:1px;background:rgba(255,255,255,.12);margin-left:4px}
.steps b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-m);border:1.5px solid rgba(255,255,255,.18);color:#9fb0c8}
.steps li.cur{color:#fff}.steps li.cur b{border-color:#5aa2ff;background:rgba(48,127,226,.25);color:#fff;box-shadow:0 0 0 4px rgba(48,127,226,.18)}
.steps li.pass{color:#b9c6d8}.steps li.pass b{background:linear-gradient(135deg,#307FE2,#22d3ee);border-color:transparent;color:#fff}
.steps li.pass:not(:last-child)::after{background:linear-gradient(90deg,#307FE2,#22d3ee)}
.lock{display:flex;align-items:center;gap:6px;font-size:12px;color:#8ea0b8;flex:none}
.lock svg{width:15px;height:15px}
@media (max-width:720px){
  .top-in{flex-wrap:wrap;justify-content:space-between;row-gap:10px;padding-left:14px;padding-right:14px}
  .dx-logo{width:108px}.steps{order:3;flex-basis:100%;gap:4px}.steps .st-t{display:none}.steps li.cur .st-t{display:inline}
  .steps li:not(:last-child)::after{width:18px}
}

/* ===== conteúdo ===== */
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 170px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-2);padding:22px}
.intro{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:18px;position:relative;overflow:hidden}
.intro::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 160px at 0% 0%,var(--accent-soft),transparent 70%);pointer-events:none}
.av{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#307FE2,#22d3ee);color:#fff;font:700 18px var(--f-d);box-shadow:0 8px 20px -8px rgba(48,127,226,.7)}
.intro h1{font-size:clamp(19px,2.6vw,23px);line-height:1.2}
.intro p{margin:5px 0 0;color:var(--muted);font-size:14.5px}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.howto{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;position:relative}
.howto div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);text-align:center}
.howto b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}
@media (max-width:560px){.intro{grid-template-columns:1fr;text-align:center}.av{margin:0 auto}.howto{grid-template-columns:1fr}}

.doc{display:flex;flex-direction:column;gap:18px;align-items:center}
.pg{position:relative;width:100%;background:#fff;border-radius:6px;box-shadow:var(--shadow-3);overflow:hidden}
.pg canvas{display:block;width:100%;height:auto}
.pg .sk{aspect-ratio:596/842;background:linear-gradient(100deg,#f1f4f8 40%,#e6ebf2 50%,#f1f4f8 60%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.pgn{position:absolute;left:10px;bottom:8px;font:500 11px var(--f-m);color:#8a94a6;background:rgba(255,255,255,.85);padding:2px 7px;border-radius:6px}
.fld{position:absolute;border:2px dashed var(--field);background:var(--field-soft);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#7a5a00;font-weight:700;font-size:clamp(9px,1.6vw,13px);line-height:1.1;text-align:center;padding:2px;transition:transform .2s var(--ease),background .2s,box-shadow .2s;animation:pulse 2s ease-in-out infinite}
.fld:hover{transform:scale(1.03);background:rgba(245,183,0,.26)}
.fld.next{box-shadow:0 0 0 4px rgba(245,183,0,.35),0 8px 24px -6px rgba(245,183,0,.7)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(245,183,0,.18)}}
.fld.done{border:1.5px solid rgba(22,138,86,.55);background:rgba(22,138,86,.06);animation:none;box-shadow:none}
.fld.done img{max-width:100%;max-height:100%;object-fit:contain}
.fld .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--field);color:#3d2c00;font-size:9.5px;padding:1px 7px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.fld.done .tag{background:var(--ok);color:#fff}

/* ===== barra inferior ===== */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -10px 30px -18px rgba(16,28,48,.35)}
.bar-in{max-width:900px;margin:0 auto;padding:12px 16px max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.prog{display:flex;align-items:center;gap:10px;flex:1 1 220px}
.ring{width:42px;height:42px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 11px var(--f-m)}
.prog-t{font-size:13.5px;line-height:1.3}.prog-t b{display:block;font-size:14.5px}
.prog-t span{color:var(--muted)}
.accept{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;flex:1 1 320px;cursor:pointer;line-height:1.35}
.accept input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.btn{text-decoration:none;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line-2);background:var(--surface);transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,#2f7de1,#1f63c4);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px rgba(48,127,226,.8)}
.btn.ok{background:linear-gradient(135deg,#19a265,#12804f);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px rgba(22,138,86,.8)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.lnk{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.below{text-align:center;margin-top:22px;display:flex;flex-direction:column;gap:8px;align-items:center}

/* ===== bloco de assinatura (modal) ===== */
.mdl{position:fixed;inset:0;z-index:60;background:rgba(7,11,20,.58);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mdl-box{width:min(640px,100%);background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px max(18px,env(safe-area-inset-bottom));box-shadow:var(--shadow-3);animation:up .3s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.mdl{align-items:center}.mdl-box{border-radius:22px;padding:24px}}
.mdl-box h3{font-size:18px;text-align:center}
.mdl-box .sub{color:var(--muted);font-size:13.5px;text-align:center;margin:4px 0 14px}
.pad{position:relative;border:1.5px dashed var(--line-2);border-radius:14px;background:#fff;touch-action:none;overflow:hidden}
.pad canvas{display:block;width:100%;height:100%;cursor:crosshair}
.pad .base{position:absolute;left:8%;right:8%;bottom:26%;border-top:1.5px solid #c9d2df;pointer-events:none}
.pad .hint{position:absolute;inset:0;display:grid;place-items:center;color:#9aa6b8;font-size:14px;pointer-events:none;transition:opacity .2s}
.mdl .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.mdl textarea{width:100%;min-height:110px;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface-2);resize:vertical}

/* ===== ecrãs de estado ===== */
.state{max-width:560px;margin:8vh auto 0;text-align:center;padding:34px 26px}
.state .ic{width:72px;height:72px;border-radius:22px;margin:0 auto 16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.state .ic svg{width:34px;height:34px}
.state.good .ic{background:var(--ok-soft);color:var(--ok)}.state.bad .ic{background:var(--crit-soft);color:var(--crit)}.state.warn .ic{background:var(--warn-soft);color:var(--warn)}
.state h1{font-size:clamp(21px,3vw,26px)}
.state p{color:var(--muted);margin:10px 0 0}
.state .row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.route{width:220px;height:70px;margin:0 auto 8px;display:block}
.route path{stroke:#307FE2;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:6 8;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.check-anim path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:fixed;left:50%;top:max(96px,calc(env(safe-area-inset-top) + 96px));transform:translateX(-50%);z-index:80;background:#0e1628;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-3);max-width:calc(100% - 32px);text-align:center}
.over{position:fixed;inset:0;z-index:70;background:rgba(7,11,20,.7);backdrop-filter:blur(5px);display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.over p{color:#b8c6da;margin:6px 0 0}
.audit{margin-top:14px;font-size:12.5px;color:var(--faint);text-align:center}
.audit code{font-family:var(--f-m);font-size:11px;word-break:break-all}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <span class="dx-logo" role="img" aria-label="Delivery Express"></span>
  <ol class="steps" id="steps"><li class="cur"><b>1</b><span class="st-t">Ler e rubricar</span></li><li><b>2</b><span class="st-t">Assinar</span></li><li><b>3</b><span class="st-t">Concluído</span></li></ol>
  <span class="lock"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Ligação segura</span>
</div></header>
<main class="wrap" id="main">
  <div class="card state"><svg class="route" viewBox="0 0 220 70"><path d="M10 55 C60 10 100 70 150 30 S200 20 212 15"/></svg><h1>A abrir o contrato…</h1><p>Só um momento.</p></div>
</main>
<div class="bar" id="bar" hidden><div class="bar-in" id="barIn"></div></div>

<script>
'use strict';
const ENDPOINT='https://script.google.com/macros/s/AKfycbzCnXGRjmssu7YuBGhzSS4EPWvsClIJaWNBDjLwqRfRCHcloJMT7lFepOn8eSERxJYtFQ/exec';
const LIBS={
  pdfjs:['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js'],
  worker:['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js','https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
  pdflib:['https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js','https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js']
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',arrow:'<path d="M12 5v14M6 13l6 6 6-6"/>',send:'<path d="M4 12l16-8-6 16-3-7z"/>',doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>'
};
const ico=(n,c='i')=>`<svg class="${c}" viewBox="0 0 24 24">${IC[n]}</svg>`;
function toast(m,ms=3600){ let t=$('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=m; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,ms); }
function loadScript(urls){ return new Promise((res,rej)=>{ let i=0; const next=()=>{ if(i>=urls.length) return rej(new Error('Não foi possível carregar os componentes do leitor de PDF.')); const s=document.createElement('script'); s.src=urls[i++]; s.onload=()=>res(); s.onerror=()=>{ s.remove(); next(); }; document.head.appendChild(s); }; next(); }); }
const pad2=n=>String(n).padStart(2,'0');
const LX=(ms,o)=>{ const p={}; new Intl.DateTimeFormat('pt-PT',{timeZone:'Europe/Lisbon',hour12:false,...o}).formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value); return p; };
const fmtDH=ms=>{ const p=LX(ms,{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); return `${p.day}/${p.month}/${p.year} ${p.hour==='24'?'00':p.hour}:${p.minute}`; };
const fmtD=ms=>{ const p=LX(ms,{day:'2-digit',month:'2-digit',year:'numeric'}); return `${p.day}/${p.month}/${p.year}`; };

/* ---------- estado ---------- */
const S={ t:new URLSearchParams(location.search).get('t')||'', data:null, bytes:null, offset:0, pdf:null, pages:[], fields:[], rub:null, sig:null, accepted:false };
const now=()=>Date.now()+S.offset;
function setStep(n){ $$('#steps li').forEach((li,i)=>{ li.className=i<n-1?'pass':i===n-1?'cur':''; }); }

function stateScreen(kind,title,text,extra=''){
  $('#bar').hidden=true;
  const icn={good:'check',bad:'x',warn:'clock',info:'doc'}[kind]||'doc';
  $('#main').innerHTML=`<div class="card state ${kind}"><div class="ic">${kind==='good'?`<svg class="i check-anim" viewBox="0 0 24 24">${IC.check}</svg>`:ico(icn)}</div><h1>${title}</h1><p>${text}</p>${extra}</div>`;
}

/* ---------- arranque ---------- */
async function start(){
  if(!/^[a-f0-9]{40,}$/i.test(S.t)) return stateScreen('bad','Link inválido ou em falta','Abra o contrato através do botão no e-mail que recebeu. Se o problema continuar, fale com a Delivery Express.');
  let j;
  try{
    const t0=Date.now();
    const r=await fetch(ENDPOINT+'?a=ver&t='+encodeURIComponent(S.t),{redirect:'follow'});
    const txt=await r.text(); j=JSON.parse(txt);
    if(j.agora) S.offset=j.agora-Math.round((t0+Date.now())/2);
  }catch(e){ return stateScreen('bad','Não foi possível abrir o contrato','Verifique a ligação à internet e tente de novo.',`<div class="row"><button class="btn pri" onclick="location.reload()">Tentar de novo</button></div>`); }
  if(!j.ok){
    const c=j.contrato||{}, who=c.colaborador?` de ${esc(c.colaborador)}`:'';
    const M={
      concluido:['good','Contrato já assinado',`O contrato${who} já foi assinado por todas as partes. A versão final foi enviada por e-mail.`],
      ja_assinado:['good','Já assinou este contrato',`A sua assinatura ficou registada. O contrato${who} seguiu para o colaborador.`],
      indisponivel:['warn','Ainda não é a sua vez',`O contrato ainda está à espera da assinatura da empresa. Vai receber um e-mail quando estiver pronto.`],
      expirado:['warn','Este link expirou','Por segurança, os links de assinatura são válidos durante 7 dias. Peça um novo link à Delivery Express.'],
      cancelado:['bad','Contrato cancelado','Este contrato foi cancelado pela Delivery Express e já não pode ser assinado.'],
      recusado:['bad','Contrato recusado','Este contrato foi recusado e já não pode ser assinado.'],
      invalido:['bad','Link inválido','Este link não corresponde a nenhum contrato ativo. Confirme que abriu o e-mail mais recente.']
    }[j.codigo]||['bad','Não foi possível abrir o contrato',esc(j.erro||'Tente de novo dentro de alguns minutos.')];
    if(j.codigo==='concluido'||j.codigo==='ja_assinado') setStep(4);
    return stateScreen(...M);
  }
  S.data=j;
  try{
    await Promise.all([loadScript(LIBS.pdfjs),loadScript(LIBS.pdflib)]);
    pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.worker[0];
    const bin=atob(j.pdf); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    S.bytes=u;
    S.pdf=await pdfjsLib.getDocument({data:u.slice()}).promise;
  }catch(e){ return stateScreen('bad','Não foi possível mostrar o contrato',esc(e.message||String(e))+'<br>Tente de novo ou use outro navegador.',`<div class="row"><button class="btn pri" onclick="location.reload()">Tentar de novo</button></div>`); }
  await layout();
}

/* ---------- campos: rubricas e assinatura ---------- */
const RUB={w:88,h:34,top:12,right:46,gap:8};
async function findLabel(rot){
  let best=null;
  for(let p=1;p<=S.pdf.numPages;p++){
    const page=await S.pdf.getPage(p); const tc=await page.getTextContent();
    tc.items.forEach(it=>{ const s=it.str||''; const k=s.indexOf(rot); if(k<0) return;
      const w=it.width||0, x0=it.transform[4], y=it.transform[5];
      const xEnd=x0+w*((k+rot.length)/Math.max(1,s.length));
      best={page:p,x:xEnd,y}; });
  }
  return best;
}
async function layout(){
  const d=S.data, c=d.contrato, emp=d.papel==='empresa';
  const n=S.pdf.numPages;
  const pg1=await S.pdf.getPage(1); const vp=pg1.getViewport({scale:1});
  const lblE=await findLabel(c.rotEmpresa), lblC=await findLabel(c.rotColab);
  const sigPage=(lblE||lblC)?(lblE||lblC).page:n;
  const sizes=[]; for(let p=1;p<=n;p++){ const pg=await S.pdf.getPage(p); const v=pg.getViewport({scale:1}); sizes.push([v.width,v.height]); }
  S.sizes=sizes; S.sigPage=sigPage;
  const fields=[];
  for(let p=1;p<=n;p++){ if(p===sigPage) continue; const [W,H]=sizes[p-1];
    const xCol=W-RUB.right-RUB.w, xEmp=xCol-RUB.gap-RUB.w;
    fields.push({kind:'rub',page:p,x:emp?xEmp:xCol,y:H-RUB.top-RUB.h,w:RUB.w,h:RUB.h}); }
  const [W,H]=sizes[sigPage-1];
  const lbl=emp?lblE:lblC;
  const sw=Math.min(210,W*0.36), sh=54;
  if(lbl) fields.push({kind:'sig',page:sigPage,x:Math.min(lbl.x+8,W-sw-30),y:lbl.y-3,w:sw,h:sh,base:lbl.y});
  else fields.push({kind:'sig',page:sigPage,x:emp?60:W-60-sw,y:120,w:sw,h:sh,base:120});
  S.fields=fields;
  S.papelNome=emp?c.papelEmpresa:c.papelColab;
  renderMain();
}

function renderMain(){
  const d=S.data, c=d.contrato, emp=d.papel==='empresa';
  const nome=d.assinante.nome, prim=nome.split(/\s+/)[0];
  const ini=nome.split(/\s+/).filter(Boolean).filter((_,i,a)=>i===0||i===a.length-1).map(w=>w[0]).join('').toUpperCase();
  const nRub=S.fields.filter(f=>f.kind==='rub').length;
  $('#main').innerHTML=`<section class="card intro"><div class="av">${esc(ini)}</div>
      <div><h1>Olá ${esc(prim)}, tem um contrato para assinar</h1>
      <p>${emp?`${esc(c.modeloNome)} de <b>${esc(c.colaborador)}</b>. Depois da sua assinatura, o contrato segue automaticamente para o colaborador.`:`${esc(c.modeloNome)} com a ${esc(c.outorgante)} (Delivery Express). A empresa já assinou: falta apenas a sua assinatura.`}</p></div>
      <div class="meta"><span class="chip">Assina como <b>${esc(S.papelNome)}</b></span><span class="chip">${S.pdf.numPages} páginas</span><span class="chip">${ico('clock')}Válido até <b>${fmtD(new Date(d.expiraEm).getTime())}</b></span></div>
      <div class="howto"><div><b>1. Leia</b>Percorra o contrato até ao fim.</div><div><b>2. Rubrique</b>${nRub} campo${nRub===1?'':'s'} amarelo${nRub===1?'':'s'} no topo das páginas.</div><div><b>3. Assine</b>No campo de assinatura e confirme.</div></div></section>
    <div class="doc" id="doc">${Array.from({length:S.pdf.numPages},(_,i)=>`<div class="pg" data-p="${i+1}" style="max-width:${Math.round(S.sizes[i][0]*1.45)}px"><div class="sk"></div><span class="pgn">Página ${i+1} de ${S.pdf.numPages}</span></div>`).join('')}</div>
    <div class="below"><span class="audit">Referência ${esc(c.id)} · Impressão digital do documento original (SHA-256):<br><code>${esc(c.hashOriginal||'')}</code></span><button class="lnk" id="refuse">Não concordo com o contrato</button></div>`;
  renderPages(); renderFields(); renderBar();
  $('#refuse').addEventListener('click',refuseFlow);
}

let renderW=0;
async function renderPages(force){
  const pgs=$$('.pg'); if(!pgs.length) return;
  const w=pgs[0].clientWidth; if(!force&&Math.abs(w-renderW)<40&&renderW) return; renderW=w;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  for(const el of pgs){ const p=+el.dataset.p; const page=await S.pdf.getPage(p);
    const v1=page.getViewport({scale:1}); const scale=el.clientWidth*dpr/v1.width; const vp=page.getViewport({scale});
    const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    const old=el.querySelector('canvas,.sk'); if(old) old.replaceWith(cv); else el.prepend(cv); }
}
let rT; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>renderPages(),250); });

function renderFields(){
  $$('.fld').forEach(x=>x.remove());
  const nx=S.fields.find(f=>!f.done);
  S.fields.forEach((f,i)=>{ const [W,H]=S.sizes[f.page-1]; const el=document.createElement('button'); el.type='button';
    el.className='fld'+(f.done?' done':'')+(f===nx?' next':''); el.dataset.i=i;
    el.style.cssText=`left:${f.x/W*100}%;top:${(H-f.y-f.h)/H*100}%;width:${f.w/W*100}%;height:${f.h/H*100}%`;
    const tag=f.kind==='rub'?'Rubrica':'Assinatura';
    el.innerHTML=`<span class="tag">${f.done?'✓ ':''}${tag}</span>`+(f.done?`<img alt="" src="${f.kind==='rub'?S.rub.url:S.sig.url}">`:(f.kind==='rub'?'Rubricar':'Assinar aqui'));
    el.setAttribute('aria-label',(f.done?'Alterar ':'')+tag.toLowerCase()+' na página '+f.page);
    el.addEventListener('click',()=>onField(i));
    $(`.pg[data-p="${f.page}"]`).appendChild(el); });
}
function onField(i){
  const f=S.fields[i];
  if(f.kind==='rub'){
    if(S.rub&&!f.done){ f.done=true; afterField(); return; }
    openPad('rub',()=>{ f.done=true; afterField(); });
  } else openPad('sig',()=>{ f.done=true; afterField(); });
}
function afterField(){ renderFields(); renderBar(); const nx=S.fields.find(f=>!f.done); if(nx) setTimeout(()=>goNext(true),250); else { setStep(2); toast('Todos os campos preenchidos. Confirme e conclua a assinatura.'); } }
function goNext(soft){ const nx=S.fields.find(f=>!f.done); if(!nx) return; const el=$(`.fld[data-i="${S.fields.indexOf(nx)}"]`); if(el) el.scrollIntoView({behavior:'smooth',block:soft?'center':'center'}); }

function renderBar(){
  const tot=S.fields.length, ok=S.fields.filter(f=>f.done).length, all=ok===tot;
  const pct=tot?ok/tot:0, C=2*Math.PI*17;
  $('#bar').hidden=false;
  $('#barIn').innerHTML=`<div class="prog"><div class="ring"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="17" fill="none" stroke="var(--line-2)" stroke-width="4"/><circle cx="21" cy="21" r="17" fill="none" stroke="${all?'var(--ok)':'var(--accent-2)'}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .5s"/></svg><b>${ok}/${tot}</b></div>
      <div class="prog-t"><b>${all?'Tudo preenchido':`${tot-ok} campo${tot-ok===1?'':'s'} por preencher`}</b><span>${all?'Falta confirmar e concluir':'Rubricas e assinatura'}</span></div></div>
    ${all?`<label class="accept"><input type="checkbox" id="acc" ${S.accepted?'checked':''}><span>Li o contrato e aceito assiná-lo eletronicamente como <b>${esc(S.papelNome)}</b>.</span></label>
      <button class="btn ok" id="finish" ${S.accepted?'':'disabled'}>${ico('send')}Concluir assinatura</button>`
    :`<button class="btn pri" id="nextBtn">${ico('arrow')}Ir para o campo seguinte</button>`}`;
  $('#nextBtn')?.addEventListener('click',()=>goNext());
  $('#acc')?.addEventListener('change',e=>{ S.accepted=e.target.checked; $('#finish').disabled=!S.accepted; });
  $('#finish')?.addEventListener('click',finish);
}

/* ---------- bloco de desenho ---------- */
function openPad(kind,onOk){
  const rub=kind==='rub';
  document.body.insertAdjacentHTML('beforeend',`<div class="mdl" id="mdl"><div class="mdl-box" role="dialog" aria-modal="true">
    <h3>${rub?'Desenhe a sua rubrica':'Desenhe a sua assinatura'}</h3><p class="sub">${rub?'As suas iniciais, como num papel. A mesma rubrica é usada em todas as páginas.':'Assine com o dedo ou com o rato, como no seu documento de identificação.'}</p>
    <div class="pad" id="pad" style="aspect-ratio:${rub?'2.4/1':'3.2/1'};max-width:${rub?'420px':'100%'};margin:0 auto"><canvas id="cv"></canvas><span class="base"></span><span class="hint" id="hint">${rub?'Rubrique aqui':'Assine aqui'}</span></div>
    <div class="row"><button class="btn ghost" id="pCancel">Cancelar</button><button class="btn" id="pClear">Limpar</button><button class="btn pri" id="pOk" disabled>${ico('check')}${rub?'Usar esta rubrica':'Usar esta assinatura'}</button></div></div></div>`);
  const cv=$('#cv'), box=$('#pad'); const dpr=Math.min(window.devicePixelRatio||1,3);
  const r=box.getBoundingClientRect(); cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0b2a6b'; ctx.fillStyle='#0b2a6b';
  const base=Math.max(1.6,r.width/(rub?150:210));
  let pts=[], drawing=false, any=false, lastW=base;
  const pos=e=>{ const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top,t:performance.now()}; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing=true; const p=pos(e); pts=[p]; lastW=base; ctx.beginPath(); ctx.arc(p.x,p.y,base/2,0,Math.PI*2); ctx.fill(); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){ const p=pos(ev); const l=pts[pts.length-1]; const dist=Math.hypot(p.x-l.x,p.y-l.y); if(dist<0.8) continue;
      const v=dist/Math.max(1,p.t-l.t); const w=Math.max(base*0.45,Math.min(base*1.35,base*1.5-v*base*0.55)); const nw=lastW*0.65+w*0.35;
      pts.push(p); if(pts.length>=3){ const a=pts[pts.length-3], b=pts[pts.length-2], c2=p; const m1={x:(a.x+b.x)/2,y:(a.y+b.y)/2}, m2={x:(b.x+c2.x)/2,y:(b.y+c2.y)/2};
        ctx.lineWidth=nw; ctx.beginPath(); ctx.moveTo(m1.x,m1.y); ctx.quadraticCurveTo(b.x,b.y,m2.x,m2.y); ctx.stroke(); }
      lastW=nw; any=true; }
    if(any){ $('#hint').style.opacity=0; $('#pOk').disabled=false; } });
  const end=()=>{ drawing=false; pts=[]; };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('pointerleave',end);
  const close=()=>$('#mdl')?.remove();
  $('#pCancel').addEventListener('click',close);
  $('#mdl').addEventListener('click',e=>{ if(e.target.id==='mdl') close(); });
  $('#pClear').addEventListener('click',()=>{ ctx.clearRect(0,0,cv.width,cv.height); any=false; $('#hint').style.opacity=1; $('#pOk').disabled=true; });
  $('#pOk').addEventListener('click',()=>{ const im=trim(cv); if(!im){ toast('Desenhe primeiro, por favor.'); return; }
    if(rub) S.rub=im; else S.sig=im; close(); onOk(); });
}
function trim(cv){
  const ctx=cv.getContext('2d'); const {width:w,height:h}=cv; const d=ctx.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(d[(y*w+x)*4+3]>8){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0) return null;
  const m=Math.round(Math.max(w,h)*0.02); x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(w-1,x1+m); y1=Math.min(h-1,y1+m);
  const o=document.createElement('canvas'); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return {url:o.toDataURL('image/png'),w:o.width,h:o.height};
}

/* ---------- PDF final ---------- */
const WIN=new Set('\u20ac\u201a\u0192\u201e\u2026\u2020\u2021\u02c6\u2030\u0160\u2039\u0152\u017d\u2018\u2019\u201c\u201d\u2022\u2013\u2014\u02dc\u2122\u0161\u203a\u0153\u017e\u0178'.split(''));
function safe(s){ return String(s??'').split('').map(ch=>{ const c=ch.charCodeAt(0); if(c===10) return ' '; if((c>=32&&c<=126)||(c>=160&&c<=255)||WIN.has(ch)) return ch; const b=ch.normalize('NFD').replace(/[̀-ͯ]/g,''); return (b&&b.charCodeAt(0)<=255)?b:'?'; }).join(''); }
function wrap(text,font,size,maxW){ const words=safe(text).split(' '); const lines=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(font.widthOfTextAtSize(t,size)>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; }
  if(cur) lines.push(cur);
  return lines.flatMap(l=>{ if(font.widthOfTextAtSize(l,size)<=maxW) return [l]; const out=[]; let s=''; for(const ch of l){ if(font.widthOfTextAtSize(s+ch,size)>maxW){ out.push(s); s=ch; } else s+=ch; } if(s) out.push(s); return out; }); }
const uaShort=ua=>{ ua=String(ua||''); const os=/Android/.test(ua)?'Android':/iPhone|iPad/.test(ua)?'iOS':/Windows/.test(ua)?'Windows':/Mac OS/.test(ua)?'macOS':/Linux/.test(ua)?'Linux':'Outro';
  const br=/Edg\//.test(ua)?'Edge':/OPR\//.test(ua)?'Opera':/SamsungBrowser/.test(ua)?'Samsung Internet':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'Navegador'; return br+' em '+os; };

async function buildPdf(){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const d=S.data, c=d.contrato, emp=d.papel==='empresa';
  const doc=await PDFDocument.load(S.bytes,{updateMetadata:false});
  const F=await doc.embedFont(StandardFonts.Helvetica), FB=await doc.embedFont(StandardFonts.HelveticaBold), FM=await doc.embedFont(StandardFonts.Courier);
  const rub=await doc.embedPng(S.rub.url), sig=await doc.embedPng(S.sig.url);
  const quando=now(), gray=rgb(.42,.46,.53), line=rgb(.78,.81,.86), ink=rgb(.06,.09,.15), blue=rgb(.12,.39,.77);
  const pages=doc.getPages();
  const fit=(img,bw,bh)=>{ const r=Math.min(bw/img.width,bh/img.height); return {w:img.width*r,h:img.height*r}; };
  for(const f of S.fields){ const pg=pages[f.page-1];
    if(f.kind==='rub'){ const s=fit(rub,f.w-6,f.h-4);
      pg.drawImage(rub,{x:f.x+(f.w-s.w)/2,y:f.y+(f.h-s.h)/2+1,width:s.w,height:s.h});
      pg.drawLine({start:{x:f.x+4,y:f.y},end:{x:f.x+f.w-4,y:f.y},thickness:.5,color:line});
      const cap=safe('Rubrica · '+S.papelNome); const cs=Math.min(6,6*(f.w-2)/F.widthOfTextAtSize(cap,6));
      pg.drawText(cap,{x:f.x+(f.w-F.widthOfTextAtSize(cap,cs))/2,y:f.y-7,size:cs,font:F,color:gray});
    } else { const s=fit(sig,f.w,f.h);
      pg.drawImage(sig,{x:f.x+(f.w-s.w)/2,y:f.base-4,width:s.w,height:s.h});
      const cap=safe(`${d.assinante.nome} · assinado eletronicamente em ${fmtDH(quando)}`);
      const cs=Math.min(6.5,6.5*(f.w+60)/F.widthOfTextAtSize(cap,6.5));
      pg.drawText(cap,{x:f.x,y:f.base-11,size:cs,font:F,color:gray}); } }

  if(!emp){
    const W=595.28,H=841.89, M=56; const pg=doc.addPage([W,H]); let y=H-M;
    const T=(t,o={})=>{ const size=o.size||10, font=o.font||F; const lines=wrap(t,font,size,o.w||W-2*M); lines.forEach(l=>{ pg.drawText(l,{x:o.x||M,y,size,font,color:o.color||ink}); y-=size*1.45; }); };
    pg.drawRectangle({x:0,y:H-8,width:W,height:8,color:blue});
    pg.drawText('DELIVERY EXPRESS',{x:M,y,size:9,font:FB,color:blue}); y-=24;
    T('Registo de assinaturas eletrónicas',{size:17,font:FB}); y-=4;
    T('Este registo faz parte integrante do documento e identifica as partes que o assinaram, quando e por que meio.',{size:9.5,color:gray}); y-=10;
    const kv=(k,v,mono)=>{ pg.drawText(safe(k),{x:M,y,size:8.5,font:FB,color:gray}); if(FB.widthOfTextAtSize(safe(k),8.5)>140) y-=12.5; const lines=wrap(v,mono?FM:F,mono?8:9.5,W-2*M-150); lines.forEach((l,i)=>{ pg.drawText(l,{x:M+150,y:y-i*12.5,size:mono?8:9.5,font:mono?FM:F,color:ink}); }); y-=Math.max(1,lines.length)*12.5+4; };
    pg.drawLine({start:{x:M,y:y+6},end:{x:W-M,y:y+6},thickness:.6,color:line}); y-=10;
    kv('Documento',c.modeloNome); kv('Referência',c.id); kv('Colaborador',`${c.colaborador}${c.nif?' · NIF '+c.nif:''}`); kv('Outorgante',c.outorgante);
    kv('Páginas',`${pages.length} páginas do contrato e esta página de registo`); kv('Enviado para assinatura',fmtDH(new Date(c.enviadoEm).getTime()));
    kv('Impressão digital (SHA-256) do documento original',c.hashOriginal||'n/d',true); y-=6;
    const signer=(title,nome,email,em,ua,ordem)=>{ pg.drawRectangle({x:M,y:y-74,width:W-2*M,height:84,borderColor:line,borderWidth:.7,color:rgb(.97,.98,.99)});
      pg.drawCircle({x:M+18,y:y-10,size:9,color:blue}); pg.drawText(String(ordem),{x:M+15.3,y:y-13.4,size:9,font:FB,color:rgb(1,1,1)});
      pg.drawText(safe(title),{x:M+34,y:y-14,size:11,font:FB,color:ink});
      const L=[['Nome',nome],['E-mail',email],['Data e hora',em?fmtDH(em)+' (hora de Lisboa)':'n/d'],['Método','Rubricas e assinatura desenhadas no ecrã, via link pessoal enviado por e-mail'],['Dispositivo',uaShort(ua)]];
      let yy=y-30; L.forEach(([k,v])=>{ pg.drawText(safe(k),{x:M+34,y:yy,size:8,font:FB,color:gray}); pg.drawText(wrap(v,F,8.5,W-2*M-140)[0]||'',{x:M+110,y:yy,size:8.5,font:F,color:ink}); yy-=10.5; });
      y-=96; };
    const ae=c.assinEmp||{};
    signer(`${c.papelEmpresa} (${c.outorgante})`,ae.nome||c.empresaNome,ae.email||c.empresaEmail,ae.em?new Date(ae.em).getTime():null,ae.dispositivo,1);
    signer(c.papelColab,d.assinante.nome,d.assinante.email,quando,navigator.userAgent,2);
    y-=4;
    T('Assinatura eletrónica simples, nos termos do Regulamento (UE) n.º 910/2014 (eIDAS). Cada parte acedeu ao documento através de um link pessoal e intransmissível, enviado para o seu endereço de e-mail, válido durante 7 dias. A impressão digital acima permite verificar que o conteúdo do contrato não foi alterado desde o envio para assinatura.',{size:8.5,color:gray});
    pg.drawText(safe('Documento gerado pela plataforma de contratos da Delivery Express · '+fmtDH(quando)),{x:M,y:28,size:7.5,font:F,color:gray});
  }
  doc.setTitle(safe(`${c.modeloNome} · ${c.colaborador}`)); doc.setAuthor('Delivery Express'); doc.setProducer('Delivery Express · Contratos'); doc.setCreator('Delivery Express · Contratos'); doc.setModificationDate(new Date(quando));
  return await doc.save();
}
function toB64(u8){ let s=''; const ch=0x8000; for(let i=0;i<u8.length;i+=ch) s+=String.fromCharCode.apply(null,u8.subarray(i,i+ch)); return btoa(s); }

async function finish(){
  if(!S.accepted||S.fields.some(f=>!f.done)) return;
  const d=S.data, emp=d.papel==='empresa';
  document.body.insertAdjacentHTML('beforeend',`<div class="over" id="over"><div><svg class="route" viewBox="0 0 220 70"><path d="M10 55 C60 10 100 70 150 30 S200 20 212 15" style="stroke:#5aa2ff"/></svg><h2 style="font-size:20px">A selar o contrato…</h2><p>Não feche esta página.</p></div></div>`);
  let out;
  try{ out=await buildPdf(); }
  catch(e){ $('#over')?.remove(); toast('Não foi possível preparar o documento: '+(e.message||e),6000); return; }
  try{
    const r=await fetch(ENDPOINT,{method:'POST',body:JSON.stringify({a:'assinar',t:S.t,aceite:true,pdf:toB64(out),ua:navigator.userAgent}),redirect:'follow'});
    const txt=await r.text(); let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('Resposta inesperada do servidor.'); }
    if(!j.ok) throw new Error(j.erro||'Erro ao gravar a assinatura.');
    $('#over')?.remove(); setStep(4);
    const url=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));
    const nomeF=`Contrato ${d.contrato.colaborador}${emp?' (assinado pela empresa)':' (assinado)'}.pdf`;
    stateScreen('good',emp?'Contrato assinado':'Contrato assinado com sucesso',
      emp?`Obrigado, ${esc(d.assinante.nome.split(' ')[0])}. O contrato seguiu agora para <b>${esc(j.proximo||d.contrato.colaborador)}</b>, que vai receber um e-mail para assinar.`
         :`Obrigado, ${esc(d.assinante.nome.split(' ')[0])}. O contrato ficou assinado por ambas as partes. Vai receber a versão final por e-mail dentro de momentos.`,
      `<div class="row"><a class="btn" href="${url}" download="${esc(nomeF)}">${ico('dl')}Descarregar cópia</a></div>`);
    celebrate();
  }catch(e){ $('#over')?.remove(); toast('Não foi possível concluir: '+(e.message||e)+' Tente de novo.',7000); }
}
function celebrate(){ const cols=['#307FE2','#22d3ee','#19a265','#F5B700']; for(let i=0;i<46;i++){ const s=document.createElement('i'); s.style.cssText=`position:fixed;z-index:90;top:-10px;left:${Math.random()*100}vw;width:8px;height:12px;border-radius:2px;background:${cols[i%4]};transform:rotate(${Math.random()*360}deg);transition:transform 2.4s cubic-bezier(.2,.7,.3,1),top 2.4s cubic-bezier(.2,.7,.3,1),opacity 2.4s;opacity:1`; document.body.appendChild(s); requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.style.top=(60+Math.random()*40)+'vh'; s.style.transform=`rotate(${Math.random()*720}deg)`; s.style.opacity=0; })); setTimeout(()=>s.remove(),2600); } }

function refuseFlow(){
  document.body.insertAdjacentHTML('beforeend',`<div class="mdl" id="mdl"><div class="mdl-box" role="dialog" aria-modal="true"><h3>Recusar o contrato</h3><p class="sub">Diga-nos o que está errado. A Delivery Express vai rever e enviar-lhe um novo contrato, se for o caso.</p>
    <textarea id="mot" placeholder="Ex.: o valor ou a morada não estão corretos"></textarea>
    <div class="row"><button class="btn ghost" id="rNo">Voltar</button><button class="btn" id="rOk" style="color:var(--crit);border-color:var(--crit)">Recusar contrato</button></div></div></div>`);
  const close=()=>$('#mdl')?.remove();
  $('#rNo').addEventListener('click',close); $('#mdl').addEventListener('click',e=>{ if(e.target.id==='mdl') close(); });
  $('#rOk').addEventListener('click',async()=>{ const m=$('#mot').value.trim(); if(m.length<3){ toast('Escreva o motivo, por favor.'); return; }
    $('#rOk').disabled=true;
    try{ const r=await fetch(ENDPOINT,{method:'POST',body:JSON.stringify({a:'recusar',t:S.t,motivo:m}),redirect:'follow'}); const j=JSON.parse(await r.text()); if(!j.ok) throw new Error(j.erro||'Erro');
      close(); stateScreen('warn','Contrato recusado','Obrigado. A Delivery Express foi avisada e vai entrar em contacto consigo.'); }
    catch(e){ $('#rOk').disabled=false; toast('Não foi possível enviar: '+(e.message||e)); } });
}
